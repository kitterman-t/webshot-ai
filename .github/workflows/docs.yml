name: docs

# Publishes the site built by CI to GitHub Pages, on every push to master and
# on demand. The site is https://kitterman-t.github.io/webshot-ai/, which
# pyproject.toml and mkdocs.yml both name.
#
# The deploy job runs only while the repository is public. GitHub Pages on a
# free account serves public repositories only, so a private repository builds
# the site here and skips the deploy rather than failing it. Deploying also
# needs Pages' source set to "GitHub Actions" in the repository settings
# (docs/05 task 4.2); until it is, the deploy job fails and says so.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install the locked environment
        run: uv sync --extra dev --extra docs --extra mcp --frozen
      # The same command CI's blocking `docs` job runs, so a site that deploys
      # is a site that already passed the link check.
      - name: Build the documentation site
        run: uv run mkdocs build --strict
      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/

  deploy:
    name: deploy
    needs: build
    # Skipped, not failed, while the repository is private (see the top).
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
