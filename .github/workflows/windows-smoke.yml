name: Windows smoke

# Windows is best-effort (docs/04-spec.md §4): this runs weekly rather than on
# every pull request, and no branch protection requires it. It exists so that
# "best-effort" is a measured claim instead of an assumption — which only holds
# if somebody sees the measurement.
#
# So a failure here fails the run. The job used to carry `continue-on-error:
# true` "so it does not block", but a scheduled workflow blocks nothing; all
# that setting did was report every run green, including four whose unit tests
# failed (107 tests, then 150) and two that never started (docs/09 P10-24). A red run
# is what GitHub notifies the owner about, and the job summary says why.
#
# A schedule can also go quiet without a red run. In a public repository
# GitHub disables a scheduled workflow after 60 days without repository
# activity, and a disabled schedule produces no run at all — so a quiet month
# here is not a green one. The Actions tab shows it disabled and re-enables it.
#
# Known Windows limitations are recorded in docs/04-spec.md §4. A test that is
# POSIX-only is skipped with its reason, and the summary lists every skip, so
# what this run did not measure is on the page next to what it did.

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: install + capture a fixture
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install the locked environment
        id: install
        run: uv sync --extra dev --frozen
      - name: Install Chromium
        id: chromium
        run: uv run playwright install chromium
      - name: Unit tests
        id: tests
        # `-n 4` as in ci.yml. Serially this step took 4.5 minutes while every
        # capture failed at the lock, and 11 once the captures ran.
        run: uv run pytest -n 4 --junitxml=out/pytest.xml
      # Each step below is its own measurement, so a failing unit test must not
      # skip the capture: for four weeks it did, and the capture never ran.
      - name: Capture a fixture without OCR
        id: capture
        if: ${{ !cancelled() && steps.chromium.outcome == 'success' }}
        run: uv run webshot tests/fixtures/professional_page.html --output out/smoke.pdf --no-ocr
      - name: Check the deliverables exist
        if: ${{ !cancelled() && steps.capture.outcome != 'skipped' }}
        shell: pwsh
        run: |
          if (-not (Test-Path out/smoke.pdf)) { throw "no PDF produced" }
          if (-not (Test-Path out/smoke.ai/manifest.json)) { throw "no bundle produced" }
      # The first run creates the profile owner-only; the second reads back
      # every entry Chromium wrote into it before reusing it, which is the
      # tree an MCP server would be handed (docs/09 P10-25).
      - name: Capture twice with an authentication profile
        id: profile
        if: ${{ !cancelled() && steps.chromium.outcome == 'success' }}
        shell: bash
        run: |
          for run in 1 2; do
            uv run webshot tests/fixtures/professional_page.html \
              --output "out/profile-$run.pdf" --no-ocr --auth-profile out/profile
          done
      - name: Check every entry of the profile is owner-only
        if: ${{ !cancelled() && steps.profile.outcome != 'skipped' }}
        run: uv run python tools/ci/profile_acl.py out/profile
      - name: Summarize the unit tests
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        shell: bash
        run: |
          uv run python tools/ci/junit_summary.py out/pytest.xml \
            --title "Unit tests on Windows (${{ steps.tests.outcome }})" \
            >> "$GITHUB_STEP_SUMMARY"
      # docs/09 P10-26: onnxruntime's Windows telemetry is switched off by an
      # API call, not the variable POSIX reads, and only a trace shows what the
      # call does. It needs nothing but the environment, so it runs whatever
      # the unit tests or the capture did.
      - name: Count onnxruntime's telemetry events
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: bash
        run: |
          uv run python tools/ci/ort_etw.py --out out/etw \
            --summary "$GITHUB_STEP_SUMMARY"
