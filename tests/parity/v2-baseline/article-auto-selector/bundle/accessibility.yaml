    - generic [ref=e18]:
      - heading "Recommendations" [level=2] [ref=e19]
      - paragraph [ref=e20]: The capture workflow should make the reliable choice the easy choice. Defaults should suit common reports, while explicit controls should remain available for unusual layouts and authenticated applications.
      - heading "Before capture" [level=3] [ref=e21]
      - paragraph [ref=e22]: Wait for the page's meaningful readiness signal, load lazy content incrementally, and let web fonts and images settle. Preserve the original document tree so linked assets and inherited styles remain valid.
      - heading "During capture" [level=3] [ref=e23]
      - paragraph [ref=e24]: Use predictable paper geometry, repeat useful context in the header, and make navigation obvious with current and total page numbers. Avoid reintroducing hidden dialogs or stripping semantic structure.
      - heading "After capture" [level=3] [ref=e25]
      - paragraph [ref=e26]: Validate the PDF structure and page count before publishing the file. Review high-value documents visually to catch clipping, awkward breaks, and content that only a human can judge.
    - generic [ref=e27]:
      - heading "Conclusion" [level=2] [ref=e28]
      - paragraph [ref=e29]: The resulting document should be ready to share without manual cleanup.