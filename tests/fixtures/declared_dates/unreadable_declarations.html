<head>
  <meta charset="utf-8">
  <!-- Declarations whose values cannot be read as one calendar date without
       a guess: a year alone, a day and month in an order the value does not
       say, a CMS's empty date, and a date written in words. -->
  <meta name="citation_date" content="2004">
  <meta name="DC.date" content="05/03/2024">
  <meta name="date" content="0000-00-00">
  <meta property="article:published_time" content="March 5, 2024">
  <title>Undated Bulletin</title>
</head>
<body>
  <article>
    <h1>Undated Bulletin</h1>
    <p>The bulletin lists the week's closures and the rooms that are open
    instead.</p>
  </article>
</body>
</html>
