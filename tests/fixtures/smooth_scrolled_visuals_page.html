<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Visuals below a smoothly scrolling box's fold</title>
<style>
  /* scrolled_visuals_page.html, with `scroll-behavior: smooth` on the window,
     on each box and on the capped frame. A restore that obeys it only starts
     an animation: the harvest returned with every box where the chart had
     left it, and the second capture in a process printed 62 to 82 ms later,
     with each box partway back and neither of its sentences on the page
     (docs/09 P39). Released for print (P16-10), the light box prints whole
     either way; the shadow box and the capped frame show the restore. */
  html, .box { scroll-behavior: smooth; }
  body { font: 16px/1.5 sans-serif; margin: 2rem; max-width: 40rem; }
  .box { height: 6rem; overflow: auto; border: 1px solid #999; }
  .spacer { height: 30rem; }
</style>
</head>
<body>
<h1>Visuals below a smoothly scrolling box's fold</h1>

<div class="box">
  <p>Top of the light box: printed where it starts.</p>
  <div class="spacer"></div>
  <svg role="img" aria-label="Light box chart" width="320" height="60"><text x="8" y="42" font-size="28" font-family="sans-serif">LIGHT BOX 3</text></svg>
  <p>Bottom of the light box: printed only if it is scrolled.</p>
</div>

<div id="host"></div>

<!-- A frame that cannot be grown for print, because its wrapper's height is
     fixed. The harvest scrolls it to the chart below its fold, and it must
     print from its top all the same. -->
<div id="capped" style="height: 6rem; margin-top: 1rem;"><iframe title="Capped frame" style="border: 0; width: 100%; height: 100%; display: block;" srcdoc="<!doctype html><style>html { scroll-behavior: smooth; } body { margin: 0; font: 16px/1.5 sans-serif; }</style><p>Top of the capped frame: printed where it starts.</p><div style='height: 30rem'></div><svg role='img' aria-label='Capped frame chart' width='320' height='60'><text x='8' y='42' font-size='28' font-family='sans-serif'>CAPPED FRAME 6</text></svg><p>Bottom of the capped frame: printed only if it is scrolled.</p>"></iframe></div>

<!-- Far enough down that photographing it scrolls the window too. -->
<div class="spacer"></div>
<div class="spacer"></div>
<svg role="img" aria-label="Page end chart" width="320" height="60"><text x="8" y="42" font-size="28" font-family="sans-serif">PAGE END 8</text></svg>

<script>
  document.getElementById('host').attachShadow({mode: 'open'}).innerHTML = `
    <style>
      .box { height: 6rem; overflow: auto; border: 1px solid #999; margin-top: 1rem; }
      .spacer { height: 30rem; }
      .box { scroll-behavior: smooth; }
    </style>
    <div class="box">
      <p>Top of the shadow box: printed where it starts.</p>
      <div class="spacer"></div>
      <svg role="img" aria-label="Shadow box chart" width="320" height="60"><text x="8" y="42" font-size="28" font-family="sans-serif">SHADOW BOX 4</text></svg>
      <p>Bottom of the shadow box: printed only if it is scrolled.</p>
    </div>`;
</script>
</body>
</html>
