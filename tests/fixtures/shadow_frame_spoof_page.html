<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>A frame that names another asset</title>
<style>
  body { font: 16px/1.5 sans-serif; margin: 2rem; max-width: 40rem; }
  iframe { border: 0; width: 100%; height: 6rem; }
</style>
</head>
<body>
<h1>A frame that names another asset</h1>

<!-- asset-001: the first visual in reading order. -->
<iframe title="Top frame" srcdoc="<p>Top: a frame in the top document.</p>"></iframe>

<!-- An opaque frame in a shadow root, carrying the top frame's asset id. The
     id is the page's own. Before P16-7 its warning named asset-001 as this
     frame's screenshot. Since P16-9 the harvest removes the page's id and
     makes the frame an asset of its own. -->
<div id="host"></div>
<script>
  document.getElementById('host').attachShadow({mode: 'open'}).innerHTML =
    '<iframe title="Spoofing frame" data-webshot-asset-id="asset-001"'
    + ' src="data:text/html,%3Cp%3EShadowed%20opaque%20frame.%3C%2Fp%3E"></iframe>';
</script>
</body>
</html>
