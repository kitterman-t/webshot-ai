<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Open Graph's title is written with name= rather than property=, as a
       documentation site writes it. Trafilatura reads og:title only as a
       property, so it gives the card's title, and without that it would give
       the text of the page's one <h1>. -->
  <title>Tide Tables | Harbor Lane Archive</title>
  <meta name="og:title" content="Tide Tables">
  <meta name="twitter:title" content="Tide Tables for the Harbor, 1890 to 1940">
</head>
<body>
  <article>
    <h1>Tide tables</h1>
    <p>The harbor master's tables, one volume a year, are kept in the map
    room. Request them a day ahead.</p>
  </article>
</body>
</html>
