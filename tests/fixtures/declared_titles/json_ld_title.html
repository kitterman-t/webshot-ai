<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Tide Tables Return | Harbor Lane Archive</title>
  <!-- The first block is the site's blog, its posts nested inside it: a
       post's headline is another page's title. The second is a graph as
       SEO plugins write it, its NewsArticle at the top. -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Blog",
    "name": "Harbor Lane Notes",
    "blogPost": [
      {"@type": "BlogPosting", "headline": "New Lockers by the Door"}
    ]
  }
  </script>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {"@type": "WebSite", "name": "Harbor Lane Archive"},
      {"@type": "NewsArticle",
       "headline": "Tide Tables Return to the Reading Room"}
    ]
  }
  </script>
</head>
<body>
  <article>
    <h1>Tide tables are back</h1>
    <p>After two years in conservation, the harbor master's tables are on
    the open shelves again.</p>
  </article>
</body>
</html>
