<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- The <title> is the only title declared, written as "Title | Site",
       and the page declares the site's name too. Trafilatura gives one side
       of the separator, "Visiting Hours". -->
  <title>Visiting Hours | Harbor Lane Archive</title>
  <meta property="og:site_name" content="Harbor Lane Archive">
</head>
<body>
  <article>
    <h2>Weekdays</h2>
    <p>The archive is open to visitors from ten until four. Bring a card or a
    letter of introduction, and allow time to register.</p>
    <h2>Weekends</h2>
    <p>The reading room is closed; the exhibition hall opens at noon.</p>
  </article>
</body>
</html>
