<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>A tide table whose byline is rebuilt when the window is resized</title>
<!-- docs/09 P135-1. A header bar fixed to the top of the window prints over
     the first line of every page. The page's script rebuilds its byline on
     each resize, as a framework that renders one byline for a narrow window
     and another for a wide one does: at a narrow window at once, with a
     longer, taller byline, and at a wide one 400ms later, as a scheduler
     would. Each rebuild replaces the byline element with a new one. So the
     covered-text check's round trip to the printed width (779px) left, one
     frame after the window was put back, the narrow byline still in place
     and the page 40px taller, and the narrow byline gone 400ms later with a
     new wide one where the first had been. Each line is 30px tall and never
     wraps, and the second page starts with a page break, so the line under
     the bar is the first of each page whatever font draws it. All of the
     text is invented. -->
<style>
  html, body { margin: 0; padding: 0; }
  body { font: 16px/30px sans-serif; color: #111; background: #fff; }
  .column { width: 380px; margin-left: 20px; }
  .line { height: 30px; white-space: nowrap; overflow: hidden; }
  .second { break-before: page; }
  .tide-bar { position: fixed; top: 0; left: 0; right: 0; height: 40px;
    background: #234; color: #fff; z-index: 20; }
  .byline { height: 30px; margin: 0; white-space: nowrap; overflow: hidden; }
  .byline-compact { height: 70px; }
</style>
</head>
<body>
<div class="tide-bar">Tide office</div>
<div class="column">
  <div class="line">Under the tide bar, page one</div>
  <p class="byline">By the quay desk</p>
  <div class="line">High water at the north quay, 06:12.</div>
</div>
<div class="column second">
  <div class="line">Under the tide bar, page two</div>
  <div class="line">High water at the south quay, 06:40.</div>
</div>
<script>
  const rebuild = () => {
    const wide = window.innerWidth >= 1000;
    const fresh = document.createElement("p");
    fresh.className = wide ? "byline" : "byline byline-compact";
    fresh.textContent = wide ? "By the quay desk" : "By the quay desk, filed from the harbor wall";
    document.querySelector(".byline").replaceWith(fresh);
  };
  let timer = null;
  window.addEventListener("resize", () => {
    clearTimeout(timer);
    if (window.innerWidth < 1000) rebuild();
    else timer = setTimeout(rebuild, 400);
  });
</script>
</body>
</html>
