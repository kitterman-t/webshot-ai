<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Videos with native controls</title>
  <style>
    body { font-family: sans-serif; margin: 24px; }
    video, iframe { display: block; margin: 16px 0; background: #222; }
    iframe { border: 0; width: 320px; height: 180px; }
  </style>
</head>
<body>
  <h1>Videos with native controls</h1>
  <!-- No source exists; the tests route `media.example` and never let a
       request through. The first video is never requested at all:
       `preload="none"` defers its load, which is what lms_page.html's plain
       video does. The second asks for its metadata, so a test decides
       whether that request fails or never answers. The third is the first
       again inside a frame, which the harvest shoots before the video. -->
  <p>A recording the page does not load until it is played.</p>
  <video
    title="Deferred recording"
    src="https://media.example/deferred.mp4"
    preload="none"
    controls
    width="320" height="180"></video>
  <p>A recording whose metadata the page asks for.</p>
  <video
    title="Fetched recording"
    src="https://media.example/fetched.mp4"
    preload="metadata"
    controls
    width="320" height="180"></video>
  <p>A recording inside a frame.</p>
  <iframe title="Framed recording" srcdoc='<!doctype html><style>body { margin: 0; } video { display: block; background: #222; }</style><video title="Recording in a frame" src="https://media.example/framed.mp4" preload="none" controls width="320" height="180"></video>'></iframe>
</body>
</html>
