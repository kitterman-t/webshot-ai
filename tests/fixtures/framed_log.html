<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Service Desk — Framed Log</title>
<meta name="description" content="A capped scrolling log inside a same-origin frame.">
<style>
  /* docs/09 P16-17. The log scrolls inside a frame, so the release that
     lets a capped box grow for print (P16-10) never saw it: it walked the
     page's own document only, and the frame printed the log's first rows.
     The frame is tall enough to show its whole document, so what prints is
     the release's doing, not the frame's height. */
  body { font: 16px/1.5 -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
         color: #1d2738; max-width: 46rem; margin: 0 auto; padding: 2rem 1.5rem; }
  iframe { width: 100%; height: 1600px; border: 0; }
</style>
</head>
<body>
