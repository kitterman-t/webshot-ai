<p>The sample standard deviation is:</p>
<p><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mi>s</mi><mo>=</mo><msqrt><mfrac><mrow><mi mathvariant="normal">Σ</mi><mo stretchy="false">(</mo><mi>x</mi><mo>−</mo><mover accent="true"><mi>x</mi><mo stretchy="true">‾</mo></mover><msup><mo stretchy="false">)</mo><mn>2</mn></msup></mrow><mrow><mi>n</mi><mo>−</mo><mn>1</mn></mrow></mfrac></msqrt></mrow><annotation encoding="application/x-tex">s = \sqrt{\frac{\Sigma (x - \overline{x})^2}{n-1}}</annotation></semantics></math></p>
<p>The median is <math alttext="(8 + 10) ÷ 2 = 9"><mrow><mo>(</mo><mn>8</mn><mo>+</mo><mn>10</mn><mo>)</mo><mo>÷</mo><mn>2</mn><mo>=</mo><mn>9</mn></mrow></math> for this list.</p>
<p>A bare formula <math><mi>n</mi><mo>−</mo><mn>1</mn></math> has only its own text.</p>
