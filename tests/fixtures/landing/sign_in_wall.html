<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sign in to your account</title>
  <meta name="description" content="A sign-in page an identity provider shows a browser with no session: the target of the redirect the sign-in-wall check refuses.">
  <style>
    body { font-family: Helvetica, Arial, sans-serif; color: #172033; margin: 0; background: #f5f7fa; }
    main { max-width: 420px; margin: 64px auto; padding: 32px; background: white; }
    label { display: block; margin: 14px 0 4px; font-weight: 600; }
    input { width: 100%; padding: 8px; border: 1px solid #cbd5e1; box-sizing: border-box; }
  </style>
</head>
<body>
  <main>
    <h1>Sign in</h1>
    <p>Use your organization account to continue to the course site.</p>
    <form method="post" action="/session">
      <label for="email">Email address</label>
      <input id="email" name="email" type="email" autocomplete="username">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password">
      <p><button type="submit">Sign in</button></p>
    </form>
  </main>
</body>
</html>
